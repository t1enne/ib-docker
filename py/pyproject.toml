[project]
name = "ibkr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pandas>=2.3.2",
    "statsmodels>=0.14.0",
    "plotly-express>=0.4.1",
    "click>=8.3.1",
    "pyyaml>=6.0.3",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.25",
    "peewee>=3.17",
    "respx>=0.22",
    "hmmlearn>=0.3.0",
    "scikit-learn>=1.3.0",
    "ib-rest-api-client",
    "websockets>=14.0",
    "beartype>=0.22.9",
    "playwright>=1.60.0",
    "streamlit>=1.58.0",
    "numpy>=2.3.3",
    "plotly>=6.3.1",
]

[tool.uv.sources]
ib-rest-api-client = { path = "../ib-rest-api-client", package = true }

# the project ACTUALLY uses `ty` for type checking.
[tool.pyright] 
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = ["--import-mode=importlib"]

[dependency-groups]
dev = [
	"pytest-mock>=3.15.1",
	"pytest-watch>=4.2.0",
]
