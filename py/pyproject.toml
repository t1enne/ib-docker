[project]
name = "ibkr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pandas>=2.3.2",
    "statsmodels>=0.14.0",
    "plotly-express>=0.4.1",
    "click>=8.3.1",
    "pyyaml>=6.0.3",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.25",
    "peewee>=3.17",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = ["--import-mode=importlib"]
